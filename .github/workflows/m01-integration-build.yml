name: M01 integration build

on:
  push:
    branches:
      - integration/m01-test
      - fix/launcher-connect
  pull_request:
  workflow_dispatch:

# A new push to the same PR/branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: releasedbg
      upload-build-for-next-job: true

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      build-mode: releasedbg
      upload-build-for-next-job: true

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Cache xmake dependencies
        uses: actions/cache@v6
        with:
          path: ~/.xmake/packages
          key: tests-ubuntu-24.04-xmake-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            tests-ubuntu-24.04-xmake-
            ubuntu-24.04-xmake-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0

      - name: Configure xmake and install dependencies
        run: xmake config --mode=releasedbg --yes -vD

      - name: Build existing native test targets
        run: |
          xmake -y TPTests
          xmake -y ActorPopulationTests
          xmake -y SessionTests
          xmake -y PersistenceTests

      - name: Run existing native test targets
        run: |
          xmake run TPTests
          xmake run ActorPopulationTests
          xmake run SessionTests
          xmake run PersistenceTests
